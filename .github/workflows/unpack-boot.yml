name: Unpack Android Boot Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Magisk
        run: |
          wget -q https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.zip
          mkdir -p magisk
          unzip -q Magisk.zip -d magisk

      - name: Find magiskboot
        run: |
          find magisk -type f -name "magiskboot" -o -name "libmagiskboot.so"

      - name: Prepare magiskboot
        run: |
          MAGISKBOOT=$(find magisk -type f -name "magiskboot" | head -n 1)

          if [ -z "$MAGISKBOOT" ]; then
            echo "magiskboot not found"
            exit 1
          fi

          cp "$MAGISKBOOT" ./magiskboot
          chmod +x ./magiskboot

      - name: Unpack boot.img
        run: |
          mkdir -p boot-unpacked
          cd boot-unpacked

          ../magiskboot unpack ../extracted/boot.img

          echo "=== Boot image contents ==="
          ls -lah

      - name: Show extracted files
        run: |
          echo "=== Files ==="
          find boot-unpacked -type f -printf '%p\n'

      - name: Commit unpacked boot image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add boot-unpacked/

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Unpack Android boot image"
            git push
          fi
