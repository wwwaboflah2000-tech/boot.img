name: Extract boot image

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract boot.img.zip
        run: |
          mkdir -p boot
          7z x boot.img.zip -oboot
          echo "Extracted files:"
          find boot -type f -printf '%p\n'

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: boot-extracted
          path: boot/
