name: Unpack Android Boot Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Magisk
        run: |
          git clone --depth 1 https://github.com/topjohnwu/Magisk.git
          cd Magisk
          echo "Magisk source downloaded"

      - name: Build magiskboot
        run: |
          cd Magisk

          ./build.py binary --stub 2>/dev/null || true

          find . -type f \( -name "magiskboot" -o -name "libmagiskboot.so" \) -print

      - name: Locate magiskboot
        run: |
          find Magisk -type f \( -name "magiskboot" -o -name "libmagiskboot.so" \) -print

      - name: Show boot image
        run: |
          file extracted/boot.img
          ls -lh extracted/boot.img
